<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#35614c"/>
    </marker>
  </defs>
  <rect width="1200" height="360" fill="#fbfcfd"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2933">Project Workflow</text>
    <text x="600" y="78" text-anchor="middle" font-size="16" fill="#52606d">Main pipeline followed in the final weed-detection prototype</text>

    <g fill="#eef7f1" stroke="#9bc3ac" stroke-width="2">
      <rect x="40" y="130" width="180" height="96" rx="18"/>
      <rect x="270" y="130" width="180" height="96" rx="18"/>
      <rect x="500" y="130" width="180" height="96" rx="18"/>
      <rect x="730" y="130" width="180" height="96" rx="18"/>
      <rect x="960" y="130" width="180" height="96" rx="18"/>
    </g>

    <g fill="#1f2933" font-size="18">
      <text x="130" y="168" text-anchor="middle" font-weight="700">1. Collect Image</text>
      <text x="130" y="196" text-anchor="middle">Upload field photo</text>

      <text x="360" y="168" text-anchor="middle" font-weight="700">2. Validate Image</text>
      <text x="360" y="196" text-anchor="middle">Check size and quality</text>

      <text x="590" y="168" text-anchor="middle" font-weight="700">3. Run YOLO Model</text>
      <text x="590" y="196" text-anchor="middle">Detect crop and weeds</text>

      <text x="820" y="168" text-anchor="middle" font-weight="700">4. Analytics Layer</text>
      <text x="820" y="196" text-anchor="middle">Mask, coverage, rows</text>

      <text x="1050" y="168" text-anchor="middle" font-weight="700">5. Display Result</text>
      <text x="1050" y="196" text-anchor="middle">Boxes and decision</text>
    </g>

    <line x1="220" y1="178" x2="270" y2="178" stroke="#35614c" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="450" y1="178" x2="500" y2="178" stroke="#35614c" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="680" y1="178" x2="730" y2="178" stroke="#35614c" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="910" y1="178" x2="960" y2="178" stroke="#35614c" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
