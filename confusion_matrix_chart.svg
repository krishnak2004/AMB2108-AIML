<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Confusion Matrix</title>
  <desc id="desc">Confusion matrix heatmap for crop and weed predictions.</desc>
  <rect x="0" y="0" width="900" height="760" fill="#fbfcfd"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="450" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2933">Confusion Matrix</text>
    <text x="450" y="88" text-anchor="middle" font-size="17" fill="#52606d">Rows = actual class, Columns = predicted class</text>

    <text x="500" y="150" text-anchor="middle" font-size="22" fill="#1f2933">Predicted Crop</text>
    <text x="700" y="150" text-anchor="middle" font-size="22" fill="#1f2933">Predicted Weed</text>

    <text x="134" y="330" transform="rotate(-90 134 330)" text-anchor="middle" font-size="22" fill="#1f2933">Actual Crop</text>
    <text x="134" y="530" transform="rotate(-90 134 530)" text-anchor="middle" font-size="22" fill="#1f2933">Actual Weed</text>

    <rect x="250" y="190" width="200" height="200" rx="18" fill="#1b6b49"/>
    <rect x="470" y="190" width="200" height="200" rx="18" fill="#d8ece0"/>
    <rect x="250" y="410" width="200" height="200" rx="18" fill="#e3f1e9"/>
    <rect x="470" y="410" width="200" height="200" rx="18" fill="#2e7d56"/>

    <g font-size="54" font-weight="700">
      <text x="350" y="314" text-anchor="middle" fill="#ffffff">116</text>
      <text x="570" y="314" text-anchor="middle" fill="#1f2933">4</text>
      <text x="350" y="534" text-anchor="middle" fill="#1f2933">8</text>
      <text x="570" y="534" text-anchor="middle" fill="#ffffff">72</text>
    </g>

    <g font-size="18" fill="#52606d">
      <text x="350" y="348" text-anchor="middle">True Negative</text>
      <text x="570" y="348" text-anchor="middle">False Positive</text>
      <text x="350" y="568" text-anchor="middle">False Negative</text>
      <text x="570" y="568" text-anchor="middle">True Positive</text>
    </g>
  </g>
</svg>
