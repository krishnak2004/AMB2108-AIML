<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1b6b49"/>
    </marker>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef8f2"/>
      <stop offset="100%" stop-color="#d7eee1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#f8fbf9"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2933">System Architecture</text>
    <text x="600" y="82" text-anchor="middle" font-size="17" fill="#52606d">Image-based weed detection using pretrained YOLO and vegetation analytics</text>

    <rect x="70" y="160" width="200" height="110" rx="20" fill="url(#box)" stroke="#8bb89d" stroke-width="2"/>
    <text x="170" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#1b6b49">User</text>
    <text x="170" y="232" text-anchor="middle" font-size="16" fill="#1f2933">Uploads crop-field image</text>

    <rect x="340" y="160" width="230" height="110" rx="20" fill="url(#box)" stroke="#8bb89d" stroke-width="2"/>
    <text x="455" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#1b6b49">Streamlit Interface</text>
    <text x="455" y="226" text-anchor="middle" font-size="16" fill="#1f2933">Upload, preview, results</text>
    <text x="455" y="248" text-anchor="middle" font-size="16" fill="#1f2933">and explanation panel</text>

    <rect x="640" y="140" width="470" height="160" rx="24" fill="#ffffff" stroke="#a7c8b4" stroke-width="2"/>
    <text x="875" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#1b6b49">Image Analysis Engine</text>

    <rect x="675" y="210" width="180" height="64" rx="14" fill="#eef7f1" stroke="#bdd8c7"/>
    <text x="765" y="248" text-anchor="middle" font-size="16" fill="#1f2933">RGB preprocessing</text>

    <rect x="880" y="210" width="195" height="64" rx="14" fill="#eef7f1" stroke="#bdd8c7"/>
    <text x="978" y="248" text-anchor="middle" font-size="16" fill="#1f2933">Vegetation segmentation</text>

    <rect x="180" y="430" width="240" height="120" rx="20" fill="url(#box)" stroke="#8bb89d" stroke-width="2"/>
    <text x="300" y="468" text-anchor="middle" font-size="22" font-weight="700" fill="#1b6b49">Feature Extraction</text>
    <text x="300" y="496" text-anchor="middle" font-size="16" fill="#1f2933">Coverage, ExG mean/std,</text>
    <text x="300" y="518" text-anchor="middle" font-size="16" fill="#1f2933">texture, components,</text>
    <text x="300" y="540" text-anchor="middle" font-size="16" fill="#1f2933">row alignment</text>

    <rect x="480" y="430" width="240" height="120" rx="20" fill="url(#box)" stroke="#8bb89d" stroke-width="2"/>
    <text x="600" y="478" text-anchor="middle" font-size="22" font-weight="700" fill="#1b6b49">Pretrained YOLO Detector</text>
    <text x="600" y="506" text-anchor="middle" font-size="16" fill="#1f2933">Detects crop and weed boxes</text>
    <text x="600" y="528" text-anchor="middle" font-size="16" fill="#1f2933">with confidence score</text>

    <rect x="780" y="430" width="260" height="120" rx="20" fill="url(#box)" stroke="#8bb89d" stroke-width="2"/>
    <text x="910" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#1b6b49">Output Layer</text>
    <text x="910" y="498" text-anchor="middle" font-size="16" fill="#1f2933">Decision card, detections,</text>
    <text x="910" y="520" text-anchor="middle" font-size="16" fill="#1f2933">mask, overlay, metrics</text>

    <line x1="270" y1="215" x2="340" y2="215" stroke="#1b6b49" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="570" y1="215" x2="640" y2="215" stroke="#1b6b49" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="765" y1="274" x2="360" y2="430" stroke="#1b6b49" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="978" y1="274" x2="570" y2="430" stroke="#1b6b49" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="420" y1="490" x2="480" y2="490" stroke="#1b6b49" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="720" y1="490" x2="780" y2="490" stroke="#1b6b49" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
